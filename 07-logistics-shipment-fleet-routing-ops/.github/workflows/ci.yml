name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    defaults:
      run:
        working-directory: 07-logistics-shipment-fleet-routing-ops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python-version }}' }
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy --cache-dir=.mypy_cache
      - run: python scripts/secret_scan.py --json secret-scan.json
      - run: python etl/run_daily_batch.py --sample
      - run: python -m pytest -q --cov --cov-report=xml --junitxml=junit.xml --cov-fail-under=80
      - run: python scripts/sanity_check.py
      - run: python -m pytest -q ../semantic-layer/tests
      - uses: open-policy-agent/setup-opa@v2
      - run: opa check policy/opa && opa test policy/opa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.python-version }}
          path: |
            07-logistics-shipment-fleet-routing-ops/junit.xml
            07-logistics-shipment-fleet-routing-ops/coverage.xml
            07-logistics-shipment-fleet-routing-ops/secret-scan.json
            07-logistics-shipment-fleet-routing-ops/data/reports/latest.json
