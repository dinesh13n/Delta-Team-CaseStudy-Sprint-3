# PROVISIONAL (owners UNRESOLVED). Persona x entity x field x purpose. Proposals [ASM], not confirmed policy.
status: PROVISIONAL
principle: deny by default; access depends on persona, entity, field, purpose and scope; sensitive fields are masked
  unless explicitly allowed
sensitive_fields:
- shipments.customer_id
- tracking_events.location
- vehicles.current_location
- vehicles.driver_id
personas:
  dispatcher:
    shipments:
      access: write
      scope: all active
      purposes:
      - dispatch
      field_overrides:
        customer_id: mask
    tracking_events:
      access: read
      scope: all
      purposes:
      - dispatch
      field_overrides:
        location: allow
    vehicles:
      access: read
      scope: all
      purposes:
      - dispatch
      field_overrides:
        current_location: allow
        driver_id: mask
    routes:
      access: write
      scope: all
      purposes:
      - dispatch
      - route_planning
      field_overrides: {}
    carrier_bookings:
      access: read
      scope: all
      purposes:
      - dispatch
      field_overrides: {}
    ai_invocations:
      access: read
      scope: all
      purposes:
      - dispatch
      field_overrides: {}
  warehouse_ops:
    shipments:
      access: read
      scope: own hub
      purposes:
      - handling
      field_overrides:
        customer_id: deny
    tracking_events:
      access: write
      scope: own hub
      purposes:
      - handling
      field_overrides:
        location: mask
    vehicles:
      access: read
      scope: own hub
      purposes:
      - handling
      field_overrides:
        current_location: mask
        driver_id: deny
    routes:
      access: read
      scope: own hub
      purposes:
      - handling
      field_overrides: {}
    carrier_bookings:
      access: none
    ai_invocations:
      access: none
  fleet_manager:
    shipments:
      access: read
      scope: own fleet
      purposes:
      - fleet_management
      field_overrides:
        customer_id: deny
    tracking_events:
      access: read
      scope: own fleet
      purposes:
      - fleet_management
      field_overrides:
        location: allow
    vehicles:
      access: write
      scope: own fleet
      purposes:
      - fleet_management
      field_overrides:
        current_location: allow
        driver_id: allow
    routes:
      access: read
      scope: own fleet
      purposes:
      - fleet_management
      field_overrides: {}
    carrier_bookings:
      access: none
    ai_invocations:
      access: none
  driver:
    shipments:
      access: read
      scope: assigned only
      purposes:
      - delivery
      field_overrides:
        customer_id: deny
    tracking_events:
      access: none
    vehicles:
      access: read
      scope: own vehicle
      purposes:
      - delivery
      field_overrides:
        current_location: allow
        driver_id: allow
    routes:
      access: read
      scope: assigned only
      purposes:
      - delivery
      field_overrides: {}
    carrier_bookings:
      access: none
    ai_invocations:
      access: none
  customs_agent:
    shipments:
      access: read
      scope: customs cases
      purposes:
      - customs_clearance
      field_overrides:
        customer_id: allow
    tracking_events:
      access: read
      scope: customs cases
      purposes:
      - customs_clearance
      field_overrides:
        location: mask
    vehicles:
      access: none
    routes:
      access: none
    carrier_bookings:
      access: none
    ai_invocations:
      access: none
  customer_support:
    shipments:
      access: read
      scope: own customers
      purposes:
      - customer_support
      field_overrides:
        customer_id: allow
    tracking_events:
      access: read
      scope: own customers
      purposes:
      - customer_support
      field_overrides:
        location: mask
    vehicles:
      access: none
    routes:
      access: none
    carrier_bookings:
      access: read
      scope: own customers
      purposes:
      - customer_support
      field_overrides: {}
    ai_invocations:
      access: read
      scope: own customers
      purposes:
      - customer_support
      field_overrides: {}
  carrier_partner:
    shipments:
      access: read
      scope: own bookings
      purposes:
      - booking
      field_overrides:
        customer_id: deny
        origin: allow
        destination: allow
    tracking_events:
      access: none
    vehicles:
      access: none
    routes:
      access: none
    carrier_bookings:
      access: write
      scope: own carrier only
      purposes:
      - booking
      field_overrides: {}
    ai_invocations:
      access: none
  ai_agent:
    shipments:
      access: read
      scope: request-scoped
      purposes:
      - exception_summary
      field_overrides:
        customer_id: deny
    tracking_events:
      access: read
      scope: request-scoped
      purposes:
      - exception_summary
      field_overrides:
        location: deny
    vehicles:
      access: none
    routes:
      access: read
      scope: request-scoped
      purposes:
      - exception_summary
      field_overrides: {}
    carrier_bookings:
      access: read
      scope: request-scoped
      purposes:
      - exception_summary
      field_overrides: {}
    ai_invocations:
      access: none
platform_roles:
  # Roles that are not business personas. They reach platform endpoints only (never business data).
  # Previously a table in code marked [ASM] (IMP-Q10); this is now the definition.
  ops:
    endpoint_class: metrics
    business_data: none
  auditor:
    endpoint_class: audit_verify
    business_data: none
approver_rule:
  decision_endpoint: 'a suggestion may be approved or rejected by any persona whose access to shipments is write (today: dispatcher)'
  reviewer: UNKNOWN (the specification names a reviewer role but does not define it; treated as the approver rule)
  self_approval: the person who requested the suggestion may decide it (not separated); recorded as a residual risk
ai_summarize:
  # IMP-Q09. The caller needs read access to shipments for its token purpose; the context itself is built
  # under the ai_agent persona, which must also be allowed.
  caller_requires: read on shipments, with the token purpose among that persona's declared purposes
  context_persona: ai_agent
  context_purpose: exception_summary
  callers_allowed_by_matrix: [dispatcher, warehouse_ops, fleet_manager, driver, customs_agent, customer_support, carrier_partner, ai_agent]
  note: every persona has shipments read today; narrowing this to dispatcher and ai_agent is an owner decision (UNRESOLVED)
operating_semantics:
  # IMP-Q11
  purpose:
    source: a claim in the bearer token
    default: when absent, the first purpose declared for the persona and entity
    rule: a purpose outside the declared list is denied
  field_mask:
    token: '***'
    applies_to: non-empty values only; an empty or null value stays as it is
    deny: the field is removed from the record
  audit:
    on_denied: recorded (action ending .denied) with the decision identifier
    on_not_found: recorded with outcome error and reason not_found
    on_audit_write_failure: fail closed; the request fails and no data is returned
    tamper_evidence: hash-chained; a verify endpoint reports the first bad record
  scope:
    enforced: false
    reason: the data has no hub, fleet or customer attribute (CD-03 in workflow-semantics.yaml)
    behaviour: the scope phrase is reported in the decision; narrowing is not applied
  tenant:
    source: a claim in the bearer token
    effect: recorded in every audit event; data is not filtered by tenant (single-tenant data)
