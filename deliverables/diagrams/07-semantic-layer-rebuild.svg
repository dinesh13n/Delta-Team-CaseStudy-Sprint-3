<text x="141.0" y="669.2" font-size="16" text-anchor="middle" fill="#1E5631" font-weight="bold">Status codes</text>
<text x="141.0" y="689.7" font-size="16" text-anchor="middle" fill="#1E5631">29 of 30 match</text>
<rect x="278" y="604" width="222" height="140" rx="6" fill="#E5F3EB" stroke="#2E8B57" stroke-width="1.6"/>
<text x="389.0" y="659.0" font-size="16" text-anchor="middle" fill="#1E5631" font-weight="bold">AI decisions</text>
<text x="389.0" y="679.4" font-size="16" text-anchor="middle" fill="#1E5631">41 of 41 agree on the</text>
<text x="389.0" y="699.9" font-size="16" text-anchor="middle" fill="#1E5631">same data</text>
<rect x="526" y="604" width="222" height="140" rx="6" fill="#E5F3EB" stroke="#2E8B57" stroke-width="1.6"/>
<text x="637.0" y="669.2" font-size="16" text-anchor="middle" fill="#1E5631" font-weight="bold">AI response fields</text>
<text x="637.0" y="689.7" font-size="16" text-anchor="middle" fill="#1E5631">the same 19</text>
<rect x="774" y="604" width="222" height="140" rx="6" fill="#FCEBEA" stroke="#C0392B" stroke-width="1.6"/>
<text x="885.0" y="659.0" font-size="16" text-anchor="middle" fill="#7B241C" font-weight="bold">Original data</text>
<text x="885.0" y="679.4" font-size="16" text-anchor="middle" fill="#7B241C">0 of 354 rows accepted</text>
<text x="885.0" y="699.9" font-size="16" text-anchor="middle" fill="#7B241C">(original: 349)</text>
<rect x="1022" y="604" width="222" height="140" rx="6" fill="#FFFFFF" stroke="#9AA5A8" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="1133.0" y="659.0" font-size="16" text-anchor="middle" fill="#5F6E71" font-weight="bold">Not rebuilt</text>
<text x="1133.0" y="679.4" font-size="16" text-anchor="middle" fill="#5F6E71">CI, Docker, policy</text>
<text x="1133.0" y="699.9" font-size="16" text-anchor="middle" fill="#5F6E71">file, web view</text>
