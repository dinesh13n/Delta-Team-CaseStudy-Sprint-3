<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="784" viewBox="0 0 1280 784" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#41545A"/></marker></defs>
<rect width="1280" height="784" fill="#FFFFFF"/>
<text x="12" y="40" font-size="26" font-weight="bold" fill="#0B3C49">Can the semantic layer rebuild the system on its own?</text>
<rect x="10" y="74" width="1260" height="250" rx="4" fill="#F3F7F8" stroke="#C5D6DA" stroke-width="1.2"/>
<text x="20" y="98" font-size="16" font-weight="bold" fill="#0B3C49">Step 1: rebuild from the semantic layer alone</text>
<rect x="30" y="134" width="222" height="150" rx="6" fill="#F2A541" stroke="#C98118" stroke-width="1.6"/>
<text x="141.0" y="183.7" font-size="16" text-anchor="middle" fill="#1B1B1B" font-weight="bold">Input</text>
<text x="141.0" y="204.2" font-size="16" text-anchor="middle" fill="#1B1B1B">semantic-layer/ only:</text>
<text x="141.0" y="224.7" font-size="16" text-anchor="middle" fill="#1B1B1B">21 files from commit</text>
<text x="141.0" y="245.2" font-size="16" text-anchor="middle" fill="#1B1B1B">a6fc839</text>
<rect x="278" y="134" width="222" height="150" rx="6" fill="#0B3C49" stroke="#0B3C49" stroke-width="1.6"/>
<text x="389.0" y="194.0" font-size="16" text-anchor="middle" fill="#FFFFFF" font-weight="bold">Blind builder agent</text>
<text x="389.0" y="214.4" font-size="16" text-anchor="middle" fill="#FFFFFF">reads nothing else; all</text>
<text x="389.0" y="234.9" font-size="16" text-anchor="middle" fill="#FFFFFF">57 actions audited</text>
<rect x="526" y="134" width="222" height="150" rx="6" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="1.6"/>
<text x="637.0" y="183.7" font-size="16" text-anchor="middle" fill="#0B3C49" font-weight="bold">PRD</text>
<text x="637.0" y="204.2" font-size="16" text-anchor="middle" fill="#0B3C49">10 API operations, 5</text>
<text x="637.0" y="224.7" font-size="16" text-anchor="middle" fill="#0B3C49">workflows, each cited</text>
<text x="637.0" y="245.2" font-size="16" text-anchor="middle" fill="#0B3C49">to the layer</text>
<rect x="774" y="134" width="222" height="150" rx="6" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="1.6"/>
<text x="885.0" y="194.0" font-size="16" text-anchor="middle" fill="#0B3C49" font-weight="bold">Application</text>
<text x="885.0" y="214.4" font-size="16" text-anchor="middle" fill="#0B3C49">own synthetic data; 175</text>
<text x="885.0" y="234.9" font-size="16" text-anchor="middle" fill="#0B3C49">tests pass</text>
<rect x="1022" y="134" width="222" height="150" rx="6" fill="#FCEBEA" stroke="#C0392B" stroke-width="1.6"/>
<text x="1133.0" y="183.7" font-size="16" text-anchor="middle" fill="#7B241C" font-weight="bold">GAPS.md</text>
<text x="1133.0" y="204.2" font-size="16" text-anchor="middle" fill="#7B241C">67 assumptions, 17 not</text>
<text x="1133.0" y="224.7" font-size="16" text-anchor="middle" fill="#7B241C">buildable, 24 layer</text>
<text x="1133.0" y="245.2" font-size="16" text-anchor="middle" fill="#7B241C">defects</text>
<rect x="10" y="344" width="1260" height="190" rx="4" fill="#F3F7F8" stroke="#C5D6DA" stroke-width="1.2"/>
<text x="20" y="368" font-size="16" font-weight="bold" fill="#0B3C49">Step 2: the same probes against both applications</text>
<rect x="30" y="394" width="300" height="110" rx="6" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="1.6"/>
<text x="180.0" y="444.2" font-size="16" text-anchor="middle" fill="#0B3C49" font-weight="bold">Original application</text>
<text x="180.0" y="464.7" font-size="16" text-anchor="middle" fill="#0B3C49">Repo 2.0 as built</text>
<rect x="950" y="394" width="300" height="110" rx="6" fill="#FFFFFF" stroke="#1F7A8C" stroke-width="1.6"/>
<text x="1100.0" y="444.2" font-size="16" text-anchor="middle" fill="#0B3C49" font-weight="bold">Rebuilt application</text>
<text x="1100.0" y="464.7" font-size="16" text-anchor="middle" fill="#0B3C49">from the layer only</text>
<rect x="400" y="384" width="480" height="130" rx="6" fill="#0B3C49" stroke="#0B3C49" stroke-width="1.6"/>
<text x="640.0" y="434.0" font-size="16" text-anchor="middle" fill="#FFFFFF" font-weight="bold">Probe script</text>
<text x="640.0" y="454.4" font-size="16" text-anchor="middle" fill="#FFFFFF">30 HTTP checks, plus the AI decision for every</text>
<text x="640.0" y="474.9" font-size="16" text-anchor="middle" fill="#FFFFFF">shipment, on each app&#x27;s data and on swapped data</text>
<rect x="10" y="554" width="1260" height="220" rx="4" fill="#F3F7F8" stroke="#C5D6DA" stroke-width="1.2"/>
<text x="20" y="578" font-size="16" font-weight="bold" fill="#0B3C49">Step 3: what came back</text>
